<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Trufas</title>
<style>
:root{--bg:#fbf6f1;--card:#fff;--tx:#2b1a14;--mu:#7a6a62;--br:#e8dcd2;--ac:#7b3f2a;--ac2:#fff;--ok:#2e7d4f;--bad:#b3392b;--warn:#b7791f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1411;--card:#2a1e19;--tx:#f5ebe4;--mu:#b5a398;--br:#40302a;--ac:#d9916f;--ac2:#1c1411;--ok:#5fc28a;--bad:#ef8575;--warn:#e5b562;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1411;--card:#2a1e19;--tx:#f5ebe4;--mu:#b5a398;--br:#40302a;--ac:#d9916f;--ac2:#1c1411;--ok:#5fc28a;--bad:#ef8575;--warn:#e5b562;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 16px 96px;max-width:560px;margin:0 auto;min-height:100%}
h1{font-size:24px;margin:4px 0 14px}
h2{font-size:19px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;font-size:15px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--br);border-radius:12px;background:var(--bg);color:var(--tx)}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 16px;background:var(--ac);color:var(--ac2);width:100%;margin-top:12px;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.sm{width:auto;padding:8px 12px;margin:0;font-size:15px}
button.del{background:transparent;color:var(--bad);border:1px solid var(--br)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:26px;font-weight:700}
.mu{color:var(--mu);font-size:15px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.item{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--br)}
.item:last-child{border:0}
.item .l{flex:1;min-width:55%}
.qty{display:flex;gap:8px;align-items:center}
.qty button{width:56px;margin:0;font-size:24px}
.qty input{text-align:center;font-size:24px;font-weight:700}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:18px;color:var(--tx)}
.chk input{width:26px;height:26px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--br);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:transparent;color:var(--mu);margin:0;padding:8px 2px;font-size:13px;display:flex;flex-direction:column;gap:2px;align-items:center;flex:1}
nav button span{font-size:24px}
nav button.on{color:var(--ac)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:24px;font-size:16px;z-index:9}
details{margin-top:18px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.box{background:var(--card);color:var(--tx);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:90%;overflow:auto}
.box p{margin:0 0 6px;font-size:19px;white-space:pre-line}
textarea{min-height:90px;font-size:16px}
</style>
</head>
<body>
<h1 id="ttl">🍫 Minhas Trufas</h1>
<main id="v"></main>
<nav id="nav"></nav>
<script>
var S={prods:[],sales:[],exp:[]},tab='resumo',mes='';
try{var raw=localStorage.getItem('trufas');if(raw){S=JSON.parse(raw)}}catch(e){}
function save(){try{localStorage.setItem('trufas',JSON.stringify(S))}catch(e){toast('Não foi possível salvar neste navegador')}}
function $(s){return document.querySelector(s)}
function R(v){return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ymd(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function br(d){var p=d.split('-');return p[2]+'/'+p[1]}
function num(v){return parseFloat(String(v).replace(',','.'))||0}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}
mes=ymd().slice(0,7);S.ord=S.ord||[];
/* janela de confirmação/pergunta própria: o confirm e o prompt do navegador podem ser bloqueados no app publicado. Retorna uma Promise: true/false (botões), lista de valores (se tiver campos) ou null (terceiro botão) */
function ask(msg,fields,ok,no,third){return new Promise(function(res){
  var d=document.createElement('div');d.className='ov';
  d.innerHTML='<div class="box"><p>'+msg+'</p>'+(fields||[]).map(function(f,i){return '<label>'+f[0]+'</label>'+(f[2]=='area'?'<textarea id="mi'+i+'" rows="7">'+esc(f[1])+'</textarea>':'<input id="mi'+i+'" '+(f[2]||'')+' value="'+esc(f[1])+'">')}).join('')+'<button id="mok">'+(ok||'OK')+'</button><button class="sec" id="mno">'+(no||'Cancelar')+'</button>'+(third?'<button class="sec" id="mx">'+third+'</button>':'')+'</div>';
  document.body.appendChild(d);
  function fin(v){d.remove();res(v)}
  d.querySelector('#mok').onclick=function(){fin(fields?fields.map(function(f,i){return d.querySelector('#mi'+i).value}):true)};
  d.querySelector('#mno').onclick=function(){fin(false)};
  var x=d.querySelector('#mx');if(x)x.onclick=function(){fin(null)};
  var i0=d.querySelector('input');if(i0)i0.focus();
})}

var TABS=[['resumo','📊','Resumo'],['vender','🛒','Vender'],['pedidos','📅','Pedidos'],['gastos','💸','Gastos'],['sabores','🍫','Sabores']];
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
  $('#nav').innerHTML=TABS.map(function(t){return '<button class="'+(t[0]==tab?'on':'')+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('');
  $('#v').innerHTML=({resumo:vResumo,vender:vVender,pedidos:vPedidos,gastos:vGastos,sabores:vSabores})[tab]();
  if(tab=='vender')calc();
}

/* ---------- RESUMO ---------- */
function vResumo(){
  var vs=S.sales.filter(function(s){return s.d.slice(0,7)==mes});
  var ex=S.exp.filter(function(e){return e.d.slice(0,7)==mes});
  var tot=0,cus=0,un=0;
  vs.forEach(function(s){tot+=s.q*s.p;cus+=s.q*s.c;un+=s.q});
  var out=0;ex.forEach(function(e){out+=e.v});
  var lucro=tot-cus-out;
  var rec=0,devs={};
  S.sales.forEach(function(s){if(!s.paid){var v=s.q*s.p;rec+=v;var k=s.cli||'Sem nome';devs[k]=(devs[k]||0)+v}});
  var ms=[];for(var i=0;i<12;i++){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);var k=ymd(d).slice(0,7);ms.push('<option value="'+k+'"'+(k==mes?' selected':'')+'>'+d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+'</option>')}
  var h=alertas()+'<label>Mês</label><select onchange="mes=this.value;render()">'+ms.join('')+'</select>';
  h+='<div class="card" style="margin-top:12px"><div class="mu">Lucro do mês</div><div class="big '+(lucro>=0?'ok':'bad')+'">'+R(lucro)+'</div><div class="mu">'+un+' trufas vendidas</div></div>';
  h+='<div class="grid"><div class="card"><div class="mu">Vendido</div><div class="big" style="font-size:20px">'+R(tot)+'</div></div><div class="card"><div class="mu">Custo das trufas</div><div class="big" style="font-size:20px">'+R(cus)+'</div></div><div class="card"><div class="mu">Outros gastos</div><div class="big" style="font-size:20px">'+R(out)+'</div></div><div class="card"><div class="mu">A receber</div><div class="big warn" style="font-size:20px">'+R(rec)+'</div></div></div>';
  var ks=Object.keys(devs);
  if(ks.length){h+='<h2>Quem está devendo</h2><div class="card">'+ks.map(function(k){return '<div class="item"><div class="l">'+esc(k)+'</div><b>'+R(devs[k])+'</b></div>'}).join('')+'</div>'}
  h+='<button onclick="zap()">📲 Enviar resumo no WhatsApp</button>';h+='<details><summary class="mu">Backup dos dados</summary><p class="mu">Os dados ficam salvos neste celular. Gere um backup e guarde (por exemplo, mandando para você mesma no WhatsApp).</p><textarea id="bk" placeholder="O backup aparece aqui. Para restaurar, cole o texto aqui."></textarea><button class="sec" onclick="gerar()">Gerar e copiar backup</button><button class="sec" onclick="restaurar()">Restaurar backup</button></details>';
  return h;
}
function gerar(){var t=$('#bk');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value);toast('Backup copiado!')}catch(e){try{document.execCommand('copy');toast('Backup copiado!')}catch(e2){toast('Copie o texto manualmente')}}}
function restaurar(){var d;try{d=JSON.parse($('#bk').value);if(!d.prods||!d.sales||!d.exp)throw 0}catch(e){toast('Backup inválido');return}ask('Isso substitui os dados atuais. Continuar?',null,'Restaurar').then(function(y){if(y){S=d;S.ord=S.ord||[];save();toast('Dados restaurados');render()}})}

/* ---------- VENDER ---------- */
function vVender(){
  if(!S.prods.length)return '<div class="card">Primeiro cadastre seus sabores na aba <b>Sabores</b> 🍫</div><button onclick="go(\'sabores\')">Cadastrar sabores</button>';
  var h='<div class="card"><label>Sabor</label><select id="sp" onchange="calc()">'+S.prods.map(function(p){return '<option value="'+p.id+'">'+esc(p.n)+' — '+R(p.p)+(p.e!=null?' ('+p.e+' em estoque)':'')+'</option>'}).join('')+'</select>';
  h+='<label>Quantidade</label><div class="qty"><button onclick="q(-1)">−</button><input id="sq" type="number" inputmode="numeric" value="1" min="1" oninput="calc()"><button onclick="q(1)">+</button></div>';
  h+='<label>Cliente (opcional)</label><input id="sc" placeholder="Nome de quem comprou">';
  h+='<label class="chk"><input type="checkbox" id="sk" checked onchange="calc()"> Já pagou</label>';
  h+='<div class="big" id="st" style="margin-top:12px"></div><button onclick="vender()">Registrar venda</button></div>';
  h+='<h2>Últimas vendas</h2><div class="card">';
  var l=S.sales.slice().reverse().slice(0,25);
  h+=l.length?l.map(function(s){return '<div class="item"><div class="l"><b>'+s.q+'× '+esc(s.n)+'</b><div class="mu">'+br(s.d)+(s.cli?' · '+esc(s.cli):'')+' · '+R(s.q*s.p)+'</div>'+(s.paid?'':'<div class="warn">Falta receber</div>')+'</div>'+(s.paid?'':'<button class="sm" onclick="pagar(\''+s.id+'\')">Recebi</button>')+'<button class="sm del" onclick="delS(\''+s.id+'\')">✕</button></div>'}).join(''):'<div class="mu">Nenhuma venda ainda.</div>';
  return h+'</div>';
}
function q(n){var e=$('#sq');e.value=Math.max(1,(parseInt(e.value)||1)+n);calc()}
function calc(){var p=S.prods.filter(function(x){return x.id==$('#sp').value})[0];if(!p)return;var n=parseInt($('#sq').value)||0;$('#st').textContent='Total: '+R(n*p.p)}
function vender(){
  var p=S.prods.filter(function(x){return x.id==$('#sp').value})[0],n=parseInt($('#sq').value)||0;
  if(!p||n<1){toast('Informe a quantidade');return}
  if(p.e!=null&&n>p.e&&!window.__ok){ask('Só tem '+p.e+' em estoque. Registrar mesmo assim?',null,'Registrar mesmo assim').then(function(y){if(y){window.__ok=1;vender();window.__ok=0}});return}
  var cli=$('#sc').value.trim(),paid=$('#sk').checked;
  if(!paid&&!cli){toast('Informe o nome de quem vai pagar depois');return}
  S.sales.push({id:uid(),d:ymd(),pid:p.id,n:p.n,q:n,p:p.p,c:p.c,cli:cli,paid:paid,dq:p.e!=null?Math.min(p.e,n):0});if(p.e!=null){p.e=Math.max(0,p.e-n)}
  save();toast('Venda registrada! '+R(n*p.p));render();
}
function pagar(id){S.sales.forEach(function(s){if(s.id==id)s.paid=true});save();toast('Pagamento anotado');render()}
function delS(id){ask('Apagar esta venda?',null,'Apagar').then(function(y){if(!y)return;var s0=S.sales.filter(function(x){return x.id==id})[0],p0=s0&&S.prods.filter(function(x){return x.id==s0.pid})[0];if(p0&&p0.e!=null){p0.e+=(s0.dq!=null?s0.dq:s0.q)}S.sales=S.sales.filter(function(s){return s.id!=id});save();render()})}

/* ---------- GASTOS ---------- */
function vGastos(){
  var h='<div class="card"><div class="mu">Ingredientes, embalagens, gás, etc.</div><label>O que foi comprado</label><input id="gt" placeholder="Ex.: chocolate, caixinhas"><label>Valor (R$)</label><input id="gv" inputmode="decimal" placeholder="0,00"><button onclick="addG()">Anotar gasto</button></div>';
  var ex=S.exp.filter(function(e){return e.d.slice(0,7)==ymd().slice(0,7)}).reverse();
  h+='<h2>Gastos do mês</h2><div class="card">'+(ex.length?ex.map(function(e){return '<div class="item"><div class="l"><b>'+esc(e.t)+'</b><div class="mu">'+br(e.d)+'</div></div><b>'+R(e.v)+'</b><button class="sm del" onclick="delG(\''+e.id+'\')">✕</button></div>'}).join(''):'<div class="mu">Nenhum gasto neste mês.</div>')+'</div>';
  return h;
}
function addG(){var t=$('#gt').value.trim(),v=num($('#gv').value);if(!t||v<=0){toast('Preencha o nome e o valor');return}S.exp.push({id:uid(),d:ymd(),t:t,v:v});save();toast('Gasto anotado');render()}
function delG(id){ask('Apagar este gasto?',null,'Apagar').then(function(y){if(y){S.exp=S.exp.filter(function(e){return e.id!=id});save();render()}})}

/* ---------- SABORES ---------- */
function vSabores(){
  var h='<div class="card"><label>Nome do sabor</label><input id="pn" placeholder="Ex.: Brigadeiro, Ninho, Maracujá"><div class="row"><div><label>Preço de venda</label><input id="pp" inputmode="decimal" placeholder="0,00"></div><div><label>Custo (cada)</label><input id="pc" inputmode="decimal" placeholder="0,00"></div></div><label>Estoque inicial (opcional)</label><input id="pe" type="number" inputmode="numeric" placeholder="Quantas já tem prontas"><button onclick="addP()">Adicionar sabor</button></div>';
  h+='<h2>Meus sabores</h2><div class="card">'+(S.prods.length?S.prods.map(function(p){return '<div class="item"><div class="l"><b>'+esc(p.n)+'</b><div class="mu">Venda '+R(p.p)+' · Custo '+R(p.c)+'</div>'+stk(p)+'</div><button class="sm" onclick="prod(\''+p.id+'\')">+ Produzi</button><button class="sm sec" onclick="edP(\''+p.id+'\')">Editar</button><button class="sm del" onclick="delP(\''+p.id+'\')">✕</button></div>'}).join(''):'<div class="mu">Nenhum sabor cadastrado.</div>')+'</div>';
  return h;
}
function addP(){var n=$('#pn').value.trim(),p=num($('#pp').value),c=num($('#pc').value);if(!n||p<=0){toast('Informe o nome e o preço');return}var e=$('#pe').value;S.prods.push({id:uid(),n:n,p:p,c:c,e:e===''?null:Math.max(0,parseInt(e)||0)});save();toast('Sabor adicionado');render()}
function edP(id){var p=S.prods.filter(function(x){return x.id==id})[0];if(!p)return;ask('Editar '+esc(p.n),[['Preço de venda (R$)',String(p.p).replace('.',','),'inputmode="decimal"'],['Custo de cada trufa (R$)',String(p.c).replace('.',','),'inputmode="decimal"'],['Estoque atual (vazio = não controlar)',p.e==null?'':p.e,'inputmode="numeric"']],'Salvar').then(function(v){if(!v)return;if(num(v[0])<=0){toast('Informe o preço');return}p.p=num(v[0]);p.c=num(v[1]);var e=v[2].trim();p.e=e===''?null:Math.max(0,parseInt(e)||0);save();toast('Atualizado (vendas antigas não mudam)');render()})}
/* mostra o estoque do sabor (vermelho se acabou, amarelo se baixo) */
function stk(p){return p.e==null?'':'<div class="'+(p.e<=0?'bad':p.e<=5?'warn':'mu')+'">Estoque: '+p.e+(p.e<=0?' (acabou)':'')+'</div>'}
/* soma trufas recém-feitas ao estoque */
function prod(id){var p=S.prods.filter(function(x){return x.id==id})[0];if(!p)return;ask('Quantas trufas de '+esc(p.n)+' você fez agora?',[['Quantidade','10','inputmode="numeric"']],'Somar ao estoque').then(function(v){var n=v?parseInt(v[0]):0;if(n>0){p.e=(p.e||0)+n;save();toast('Estoque atualizado');render()}})}
/* avisos no Resumo: encomendas para hoje/atrasadas e estoque baixo */
function alertas(){var h='',hj=ymd();var o=S.ord.filter(function(x){return x.d<=hj});if(o.length)h+='<div class="card"><b class="warn">📅 '+o.length+' encomenda(s) para entregar hoje ou atrasada(s)</b><button class="sec" onclick="go(\'pedidos\')">Ver encomendas</button></div>';var b=S.prods.filter(function(x){return x.e!=null&&x.e<=5});if(b.length)h+='<div class="card"><b class="warn">🍫 Estoque baixo:</b> '+b.map(function(x){return esc(x.n)+' ('+x.e+')'}).join(', ')+'</div>';return h}
/* monta o texto do resumo do mês e abre o WhatsApp */
function zap(){var t=0,c=0,u=0,o=0,r=0;S.sales.forEach(function(s){if(s.d.slice(0,7)==mes){t+=s.q*s.p;c+=s.q*s.c;u+=s.q}if(!s.paid)r+=s.q*s.p});S.exp.forEach(function(e){if(e.d.slice(0,7)==mes)o+=e.v});var tx='🍫 Resumo das trufas — '+mes.split('-').reverse().join('/')+'\n• Trufas vendidas: '+u+'\n• Vendido: '+R(t)+'\n• Custo das trufas: '+R(c)+'\n• Outros gastos: '+R(o)+'\n• Lucro: '+R(t-c-o)+'\n• A receber: '+R(r);var w=window.open('https://wa.me/?text='+encodeURIComponent(tx),'_blank');if(!w){ask('Copie o resumo e cole no WhatsApp:',[['Resumo',tx,'area']],'Copiar','Fechar').then(function(v){if(v){try{navigator.clipboard.writeText(v[0]);toast('Copiado!')}catch(e){}}})}}
/* ---------- PEDIDOS (encomendas) ---------- */
function vPedidos(){
  if(!S.prods.length)return '<div class="card">Primeiro cadastre seus sabores na aba <b>Sabores</b> 🍫</div><button onclick="go(\'sabores\')">Cadastrar sabores</button>';
  var hj=ymd();
  var h='<div class="card"><label>Cliente</label><input id="oc" placeholder="Nome de quem encomendou"><label>Sabor</label><select id="os">'+S.prods.map(function(p){return '<option value="'+p.id+'">'+esc(p.n)+' — '+R(p.p)+'</option>'}).join('')+'</select><div class="row"><div><label>Quantidade</label><input id="oq" type="number" inputmode="numeric" value="10"></div><div><label>Entrega</label><input id="od" type="date" value="'+hj+'"></div></div><label>Observação (opcional)</label><input id="on" placeholder="Ex.: caixa de presente"><button onclick="addO()">Anotar encomenda</button></div>';
  var l=S.ord.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  h+='<h2>Encomendas pendentes</h2><div class="card">'+(l.length?l.map(function(o){var tag=o.d<hj?'<span class="bad">ATRASADA</span> · ':o.d==hj?'<span class="warn">HOJE</span> · ':'';return '<div class="item"><div class="l"><b>'+o.q+'× '+esc(o.n)+'</b><div class="mu">'+tag+br(o.d)+' · '+esc(o.cli)+' · '+R(o.q*o.p)+'</div>'+(o.obs?'<div class="mu">'+esc(o.obs)+'</div>':'')+'</div><button class="sm" onclick="entregar(\''+o.id+'\')">Entregue</button><button class="sm del" onclick="delO(\''+o.id+'\')">✕</button></div>'}).join(''):'<div class="mu">Nenhuma encomenda pendente.</div>')+'</div>';
  return h}
function addO(){var p=S.prods.filter(function(x){return x.id==$('#os').value})[0],c=$('#oc').value.trim(),q=parseInt($('#oq').value)||0,d=$('#od').value;if(!p||!c||q<1||!d){toast('Preencha cliente, quantidade e data');return}S.ord.push({id:uid(),d:d,cli:c,pid:p.id,n:p.n,q:q,p:p.p,c:p.c,obs:$('#on').value.trim()});save();toast('Encomenda anotada');render()}
/* ao entregar, a encomenda vira uma venda e baixa o estoque */
function entregar(id){var o=S.ord.filter(function(x){return x.id==id})[0];if(!o)return;ask('Entrega de '+o.q+'× '+esc(o.n)+' para '+esc(o.cli)+'.\nO cliente já pagou?',null,'Entregue e pago','Entregue, paga depois','Voltar').then(function(v){if(v===null)return;var p=S.prods.filter(function(x){return x.id==o.pid})[0];S.sales.push({id:uid(),d:ymd(),pid:o.pid,n:o.n,q:o.q,p:o.p,c:o.c,cli:o.cli,paid:v===true,dq:p&&p.e!=null?Math.min(p.e,o.q):0});if(p&&p.e!=null){p.e=Math.max(0,p.e-o.q)}S.ord=S.ord.filter(function(x){return x.id!=id});save();toast('Entrega registrada como venda');render()})}
function delO(id){ask('Apagar esta encomenda?',null,'Apagar').then(function(y){if(y){S.ord=S.ord.filter(function(x){return x.id!=id});save();render()}})}
function delP(id){ask('Apagar este sabor? As vendas já feitas continuam no histórico.',null,'Apagar').then(function(y){if(y){S.prods=S.prods.filter(function(p){return p.id!=id});save();render()}})}

render();
</script>
</body>
</html>
